[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# Permite que Telegram conecte a nuestra API de webhooks sin problemas
[[redirects]]
  from = "/api/webhooks/telegram"
  to = "/api/webhooks/telegram"
  status = 200
  force = true
